<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 777 Birthday</title>
<style>
:root{
  --bg:#171329; --panel:#292044; --gold:#ffd45a; --gold2:#b87916;
  --pink:#ff5f9e; --cyan:#5ee7ff; --white:#fff8e7;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--white);
  font-family:"Trebuchet MS","Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at 20% 10%,#49306d 0 8%,transparent 28%),
    radial-gradient(circle at 90% 80%,#3b245d 0 5%,transparent 25%),var(--bg);
}
.app{
  width:min(1200px,94vw); min-height:100vh; margin:auto;
  display:grid; grid-template-columns:250px 1fr; gap:24px;
  align-items:center; padding:28px 0;
}
.family-panel,.machine{
  border:5px solid var(--gold); border-radius:28px;
  background:linear-gradient(145deg,#38275b,#211a3b);
  box-shadow:0 0 0 5px var(--gold2),0 18px 45px #0008,inset 0 0 25px #fff1;
}
.family-panel{padding:22px 16px}
.family-panel h2{text-align:center;color:var(--gold);font-size:1.35rem;margin:0 0 18px}
.family-list{display:grid;gap:11px}
.family-button{
  width:100%; min-height:52px; border:2px solid #ffffff33; border-radius:16px;
  padding:12px;color:var(--white);background:#ffffff12;font:inherit;font-size:1.1rem;
  cursor:pointer;transition:.18s;
}
.family-button:hover:not(:disabled){transform:translateX(5px) scale(1.02);background:#ffcf4d33;border-color:var(--gold)}
.family-button.selected{color:#24152d;background:linear-gradient(90deg,var(--gold),#fff09a);border-color:#fff;box-shadow:0 0 18px var(--gold)}
.family-button:disabled{cursor:not-allowed;opacity:.65}

.machine{position:relative;padding:28px;text-align:center;overflow:hidden}
.machine:before,.machine:after{content:"✦";position:absolute;color:var(--gold);font-size:2rem;animation:twinkle 1.2s infinite alternate}
.machine:before{top:18px;left:24px}.machine:after{right:24px;bottom:18px;animation-delay:.5s}
h1{margin:0 0 8px;color:var(--gold);font-size:clamp(2rem,5vw,4.2rem);letter-spacing:.08em;text-shadow:0 4px 0 var(--gold2),0 0 22px #fff8}
.subtitle{min-height:1.6em;margin:0 0 24px;color:#ffdff0;font-size:1.15rem}

.slot-frame{
  display:flex;justify-content:center;gap:clamp(12px,3vw,24px);
  padding:clamp(18px,4vw,34px);border:8px solid var(--gold2);border-radius:22px;
  background:#100d20;box-shadow:inset 0 0 25px #000,0 0 20px var(--gold);
}
.reel{
  width:min(30vw,190px);height:clamp(150px,22vw,220px);
  position:relative;overflow:hidden;border:5px solid #fff0a8;border-radius:16px;
  background:linear-gradient(#4b326d,#171126);box-shadow:inset 0 0 25px #000;
}
.reel-window{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(3rem,9vw,7rem);font-weight:900;
  text-shadow:0 4px 0 #000,0 0 18px var(--cyan);
  z-index:2;
}
.reel-strip{
  position:absolute;left:0;right:0;top:0;
  display:flex;flex-direction:column;align-items:center;
  will-change:transform;
}
.reel-item{
  height:clamp(150px,22vw,220px);display:grid;place-items:center;
  flex:none;width:100%;font-size:clamp(3rem,9vw,7rem);font-weight:900;
  text-shadow:0 4px 0 #000,0 0 18px var(--cyan);
}
.reel:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(to bottom,#0008 0%,transparent 25%,transparent 75%,#0008 100%);
}
.reel.landed{animation:land .28s ease-out}
.result{min-height:2.2em;margin:24px 0 0;color:var(--gold);font-size:clamp(1.4rem,4vw,2.4rem);font-weight:bold}
.hint{margin:12px 0 0;color:#d9c9ff}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti span{position:absolute;top:-30px;width:12px;height:20px;animation:fall 2.8s linear forwards}
@keyframes land{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8) rotate(0)}to{opacity:1;transform:scale(1.3) rotate(25deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:700px){
  .app{grid-template-columns:1fr;padding:22px 0}
  .family-panel{order:2}.machine{order:1;padding:22px 14px}
  .family-list{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<main class="app">
  <aside class="family-panel">
    <h2>🎂 가족을 선택하세요</h2>
    <div id="familyList" class="family-list"></div>
  </aside>

  <section class="machine" aria-live="polite">
    <h1>🎰 777 BIRTHDAY</h1>
    <p id="subtitle" class="subtitle">가족을 선택하세요!</p>

    <div class="slot-frame">
      <div id="monthReel" class="reel">
        <div class="reel-strip" id="monthStrip"></div>
        <div class="reel-window">?</div>
      </div>
      <div id="dayReel" class="reel">
        <div class="reel-strip" id="dayStrip"></div>
        <div class="reel-window">?</div>
      </div>
    </div>

    <p id="result" class="result"></p>
    <p class="hint">가족 이름을 누르면 생일 슬롯이 시작됩니다!</p>
  </section>
</main>
<div id="confetti" class="confetti"></div>

<script>
/* ===== 가족 정보 수정 영역 ===== */
const family = [
  {name:"아빠", birthday:"02-09", emoji:"👨"},
  {name:"엄마", birthday:"08-21", emoji:"👩"},
  {name:"딸", birthday:"10-09", emoji:"👧"},
  {name:"아들", birthday:"12-22", emoji:"👦"}
];

const symbols=["7","🍒","⭐","🍀","🎂","🎁","🎈","23","12","8","25"];
const familyList=document.getElementById("familyList");
const monthStrip=document.getElementById("monthStrip");
const dayStrip=document.getElementById("dayStrip");
const monthReel=document.getElementById("monthReel");
const dayReel=document.getElementById("dayReel");
const subtitle=document.getElementById("subtitle");
const result=document.getElementById("result");
const confetti=document.getElementById("confetti");

let spinning=false, runToken=0;

family.forEach((person)=>{
  const b=document.createElement("button");
  b.type="button"; b.className="family-button";
  b.textContent=`${person.emoji} ${person.name}`;
  b.addEventListener("click",()=>startSlot(person,b));
  familyList.appendChild(b);
});

function buildStrip(strip, finalValue){
  strip.innerHTML="";
  const items=[];
  // 긴 스크롤을 위해 충분한 수의 랜덤 항목을 만든다.
  for(let i=0;i<30;i++){
    const item=document.createElement("div");
    item.className="reel-item";
    item.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    items.push(item);
    strip.appendChild(item);
  }
  // 마지막 칸은 정확한 생일 숫자.
  const finalItem=document.createElement("div");
  finalItem.className="reel-item";
  finalItem.textContent=finalValue;
  strip.appendChild(finalItem);
  return strip.children.length-1;
}

function spinReel(reel,strip,finalValue,duration,token){
  return new Promise(resolve=>{
    const finalIndex=buildStrip(strip,finalValue);
    const itemHeight=reel.clientHeight;
    const targetY=-(finalIndex*itemHeight);
    const startY=0;
    const start=performance.now();

    function frame(now){
      if(token!==runToken){resolve(false);return;}
      const t=Math.min((now-start)/duration,1);
      // 빠르게 시작해서 부드럽게 감속
      const eased=1-Math.pow(1-t,4);
      const y=startY+(targetY-startY)*eased;
      strip.style.transform=`translate3d(0,${y}px,0)`;

      if(t<1){
        requestAnimationFrame(frame);
      }else{
        reel.classList.remove("landed");
        void reel.offsetWidth;
        reel.classList.add("landed");
        resolve(true);
      }
    }
    requestAnimationFrame(frame);
  });
}

async function startSlot(person,button){
  if(spinning)return;
  spinning=true;
  const token=++runToken;

  document.querySelectorAll(".family-button").forEach(b=>{
    b.disabled=true;b.classList.remove("selected");
  });
  button.classList.add("selected");

  const [month,day]=person.birthday.split("-");
  subtitle.textContent=`${person.emoji} ${person.name}의 생일을 찾는 중...`;
  result.textContent="";
  confetti.innerHTML="";

  // 월을 먼저 멈추고, 잠시 뒤 일을 멈춰 슬롯머신 느낌을 강화한다.
  const monthPromise=spinReel(monthReel,monthStrip,month,2600,token);
  await new Promise(r=>setTimeout(r,650));
  const dayPromise=spinReel(dayReel,dayStrip,day,3300,token);

  const monthOK=await monthPromise;
  const dayOK=await dayPromise;
  if(!monthOK||!dayOK)return;

  subtitle.textContent=`${person.emoji} ${person.name}의 특별한 날!`;
  result.textContent=`🎉 ${Number(month)}월 ${Number(day)}일! 🎂`;
  createConfetti();

  setTimeout(()=>{
    if(token!==runToken)return;
    spinning=false;
    document.querySelectorAll(".family-button").forEach(b=>b.disabled=false);
  },1800);
}

function createConfetti(){
  confetti.innerHTML="";
  const colors=["#ffd45a","#ff5f9e","#5ee7ff","#a8ff78","#ffffff"];
  for(let i=0;i<70;i++){
    const p=document.createElement("span");
    p.style.left=`${Math.random()*100}%`;
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    p.style.animationDelay=`${Math.random()*.7}s`;
    p.style.animationDuration=`${2+Math.random()*1.5}s`;
    confetti.appendChild(p);
  }
  setTimeout(()=>confetti.innerHTML="",4500);
}
</script>
</body>
</html>
